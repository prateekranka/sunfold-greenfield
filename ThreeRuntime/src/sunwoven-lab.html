<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunfold — Sunwoven Weaver lab (issue #24)</title>
  <style>
    body { margin: 0; background: #050711; color: #f5e7c2; font: 12px/1.4 -apple-system, sans-serif; }
    #sunwoven-root { position: fixed; inset: 0; }
    #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 16px; align-items: baseline; pointer-events: none; }
    #hud span { background: rgba(5, 7, 17, 0.72); padding: 4px 8px; border: 1px solid rgba(245, 231, 194, 0.25); }
    #hud #current-clip { font-weight: 600; }
    #hud #capture-log { color: #7fcdbb; }
  </style>
</head>
<body>
  <div id="sunwoven-root"></div>
  <div id="hud">
    <span id="status">loading</span>
    <span id="current-clip">—</span>
    <span id="capture-log"></span>
    <span id="proof-summary"></span>
  </div>
  <script src="sunwoven-lab.bundle.js"></script>
</body>
</html>
