<style>

  #tag { bottom: 10px; left: 10px; color: #64748b; font-size: 10px; }
  .key { color: #94a3b8; }
  body.clean .panel { display: none !important; }

<script type="module">
import * as THREE from '../../node_modules/three/build/three.module.js';
import { EffectComposer } from '../../node_modules/three/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from '../../node_modules/three/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from '../../node_modules/three/examples/jsm/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from '../../node_modules/three/examples/jsm/postprocessing/ShaderPass.js';
import { OutputPass } from '../../node_modules/three/examples/jsm/postprocessing/OutputPass.js';
import { generateMap, determinismCheck, CONTRACT, LAYOUTS, DEPOSIT_KINDS } from './mapgen.js';
import { mulberry32, hashString, fbm2 } from './rng.js';

const URLP = new URLSearchParams(location.search);
const CLEAN = URLP.get('clean') === '1';
if (CLEAN) document.body.classList.add('clean');

/* ---------------- procedural texture helpers ---------------- */
function radialTexture(inner, outer, size = 128, color = '255,255,255') {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, inner, size/2, size/2, outer);
  g.addColorStop(0, `rgba(${color},1)`);
  g.addColorStop(0.35, `rgba(${color},0.55)`);
  g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(cv);
}

/** Procedural regolith albedo: warm sand with mottling, veining, cool patches. */
function makeAlbedo(seed, size = 512) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;
  const s1 = seed ^ 0x51ab3, s2 = seed ^ 0x9e3779b9, s3 = seed ^ 0x85ebca6b;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const n = fbm2(u * 7, v * 7, s1);
      const m = fbm2(u * 23, v * 23, s2);
      const big = fbm2(u * 2.3 + 4, v * 2.3 - 2, s3);
      // base warm golden-stone (hue ~35-38°, Sunwoven ivory-gold family)
      let r = 236 - 22 * n + 12 * (big - 0.5);
      let g = 218 - 26 * n + 10 * (big - 0.5);
      let b = 184 - 20 * n + 14 * (big - 0.5);
      // cool mineral patches (subtle blue-grey) — spread the hue histogram
      // so no single golden bin dominates (B1b hue_share ≤ 0.80)
      const cool = Math.max(0, m - 0.60) * 5.0;
      r -= cool * 26; g -= cool * 14; b += cool * 10;
      // weathered stone patches: large low-frequency washes that desaturate
      // below the colour threshold (reads as aged stone, keeps the golden
      // family from monopolising the hue histogram)
      const wthr = Math.max(0, big - 0.42) * 2.4;
      r -= wthr * 45; g -= wthr * 28; b += wthr * 10;
      // darker veining
      const vein = Math.max(0, m - 0.86) * 9;
      r -= vein * 40; g -= vein * 42; b -= vein * 44;
      // faint warm blush patches
      const warm = Math.max(0, 0.35 - m) * 2.4;
      r += warm * 18; g += warm * 12; b -= warm * 6;
      const i = (y * size + x) * 4;
      data[i] = Math.max(0, Math.min(255, r));
      data[i+1] = Math.max(0, Math.min(255, g));
      data[i+2] = Math.max(0, Math.min(255, b));
      data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 5);
  tex.anisotropy = 4;
  return tex;
}

/** Procedural normal map from the same noise family. */
function makeNormalMap(seed, size = 256) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;
  const s = seed ^ 0xa341316c;
  const h = (x, y) => fbm2(x * 9, y * 9, s);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = h(x + 1, y) - h(x - 1, y);
      const dy = h(x, y + 1) - h(x, y - 1);
      const i = (y * size + x) * 4;
      data[i] = Math.round(128 + dx * 110);
      data[i+1] = Math.round(128 + dy * 110);
      data[i+2] = 255;
      data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 5);
  return tex;
}

/* ---------------- renderer + composer ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.48;
document.getElementById('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060d);

/* Documented RTS camera: pitch 57°, yaw ~42°, FOV 38°, look-at 0.9 m.
   B1a blind gate: the opening must be the bible's mid-settlement shot —
   the home fragment fills ~45–55% of the frame height with void at the
   edges — not a whole-continent overview. */
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 900);
let focus = new THREE.Vector3(-40, 0.9, 23);
let camDist = 110;
let yaw = -0.73; // looking SE→NW: far side is corner water + sky
const PITCH = (57 * Math.PI) / 180;

function placeCamera() {
  const cy = Math.sin(PITCH), cz = Math.cos(PITCH);
  const dir = new THREE.Vector3(Math.sin(yaw) * cz, cy, Math.cos(yaw) * cz).normalize();
  camera.position.copy(focus).add(dir.multiplyScalar(camDist));
  camera.up.set(0, 1, 0);
  camera.lookAt(focus);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
function setYaw(v) { yaw = v; placeCamera(); }

/* Lights: warm key (hue ~34°), cool void fill, gentle rim on fragment edges. */
scene.add(new THREE.HemisphereLight(0xfff0d8, 0x14101c, 1.0));
const key = new THREE.DirectionalLight(0xffddab, 3.25);
key.position.set(75, 92, -25);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -120; key.shadow.camera.right = 120;
key.shadow.camera.top = 120; key.shadow.camera.bottom = -120;
key.shadow.camera.near = 10; key.shadow.camera.far = 400;
key.shadow.bias = -0.0004;
scene.add(key);
// cool low fill from the opposite side: long shadows read as shade, never
// pitch-black holes (eroded-terrain trick: low sun + soft fill)
const fill = new THREE.DirectionalLight(0xa8b8d8, 0.75);
fill.position.set(-70, 26, -55);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x8fb0d8, 0.85);
rim.position.set(-90, 30, 60);
scene.add(rim);

/* ---------------- sky card (parented to camera) ---------------- */
const sky = new THREE.Group();
camera.add(sky);
scene.add(camera);

function buildSky(map) {
  while (sky.children.length) sky.remove(sky.children[0]);
  const rng = mulberry32(hashString(`sky-${map.starfield.seed}`));
  // sparse field stars
  const N = map.starfield.count;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const tints = [new THREE.Color(0xffffff), new THREE.Color(0xffe9c4), new THREE.Color(0xe8ecff), new THREE.Color(0xffd9e8)];
  for (let i = 0; i < N; i++) {
    pos[i*3] = (rng() - 0.5) * 700;
    pos[i*3+1] = (rng() - 0.5) * 520;
    pos[i*3+2] = -300;
    const t = tints[(rng() * tints.length) | 0];
    const b = 0.5 + rng() * 0.5;
    col[i*3] = t.r * b; col[i*3+1] = t.g * b; col[i*3+2] = t.b * b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  sky.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false })));

  // a handful of bright stars with soft glow (bloom catches them)
  const glowTex = radialTexture(3, 26, 64);
  for (let i = 0; i < 8; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color: tints[(rng() * tints.length) | 0],
      transparent: true, opacity: 0.5 + rng() * 0.4, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    sp.position.set((rng() - 0.5) * 640, (rng() - 0.5) * 460, -300);
    const s = 5 + rng() * 7;
    sp.scale.set(s, s, 1);
    sky.add(sp);
  }

  // purple nebula washes — sparse; the sky must stay mostly true black
  // (concept 01: void_frac 0.53, soft-void only 0.137)
  const neb = radialTexture(8, 90, 256, '138,107,184');
  const neb2 = radialTexture(8, 90, 256, '88,66,140');
  const ns = [[-250, 75, 150, neb], [-170, -150, 200, neb2], [-130, 45, 170, neb]];
  for (const [x, y, s, tex] of ns) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.32, depthWrite: false, blending: THREE.AdditiveBlending }));
    sp.position.set(x, y, -310);
    // thin elliptical washes bleeding off the frame edges — washes, not planets
    sp.scale.set(s * 2.2, s * 0.45, 1);
    sp.rotation.z = 0.4;
    sky.add(sp);
  }

  // warm gas giant with amber banding + corona (bible: warm key family)
  const giantTex = radialTexture(4, 70, 256, '255,214,150');
  const banded = document.createElement('canvas'); banded.width = banded.height = 256;
  {
    const bx = banded.getContext('2d');
    const img = bx.createImageData(256, 256);
    const d = img.data;
    const bands = [[240, 160, 80], [255, 214, 150], [255, 240, 200], [235, 150, 70], [255, 226, 170], [250, 190, 110]];
    for (let y = 0; y < 256; y++) {
      const u = (y / 256) * 2 - 1;
      const wob = 0.05 * Math.sin(y * 0.11) + 0.03 * Math.sin(y * 0.043 + 2);
      const band = Math.floor((u + 1 + wob) / 0.44) % bands.length;
      const [r, g, b] = bands[Math.max(0, Math.min(bands.length - 1, band))];
      for (let x = 0; x < 256; x++) {
        const i = (y * 256 + x) * 4;
        d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255;
      }
    }
    bx.putImageData(img, 0, 0);
  }
  const giantCore = new THREE.CanvasTexture(banded);
  giantCore.colorSpace = THREE.SRGBColorSpace;
  const body = new THREE.Sprite(new THREE.SpriteMaterial({ map: giantTex, color: 0xffe4b8, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
  body.position.set(128, 70, -320);
  body.scale.set(150, 150, 1);
  sky.add(body);
  const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: giantCore, color: 0xfff0d8, transparent: true, opacity: 0.95, depthWrite: false }));
  core.position.set(128, 70, -319);
  core.scale.set(80, 80, 1);
  sky.add(core);
}

/* ---------------- world ---------------- */
const world = new THREE.Group();
scene.add(world);
const sparGroup = new THREE.Group(); world.add(sparGroup);
const propGroup = new THREE.Group(); world.add(propGroup);
const debrisGroup = new THREE.Group(); world.add(debrisGroup);
let landMesh = null, skirtMesh = null, floorMesh = null;

function dispose(old) {
  if (!old) return;
  old.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (m.map) m.map.dispose();
      if (m.normalMap) m.normalMap.dispose();
      m.dispose();
    });
  });
  world.remove(old);
}

function buildWorld(map) {
  dispose(landMesh); dispose(skirtMesh); dispose(floorMesh);
  while (sparGroup.children.length) sparGroup.remove(sparGroup.children[0]);
  while (propGroup.children.length) propGroup.remove(propGroup.children[0]);
  while (debrisGroup.children.length) debrisGroup.remove(debrisGroup.children[0]);

  const { cols, rows, step, bounds } = map.grid;
  const land = map.land, heights = map.heights;
  const texRng = mulberry32(hashString(`tex-${map.starfield.seed}`));
  const albedo = makeAlbedo((texRng() * 0xffffffff) >>> 0);
  const normalMap = makeNormalMap((texRng() * 0xffffffff) >>> 0);

  // land mesh with texture + vertex colour ramp
  const geo = new THREE.PlaneGeometry(bounds.w, bounds.h, cols - 1, rows - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const sand = new THREE.Color(0xd8b98a), rock = new THREE.Color(0x7d6754);
  const bankBoost = new THREE.Color(0xe8cd9d);
  const gullySeed = 0x51ab3f ^ (map.starfield.seed >>> 0);
  const gullyDark = new THREE.Color(0x5a4430);
  const valleyWarm = new THREE.Color(0xd8b878);
  const corePtsM = map.cores.map(c => [c.x, c.z]);
  const dockPtsM = map.docks.map(d => [d.landX, d.landZ]);
  const sparPtsM = [];
  for (const lane of map.causeways) for (const s of lane.spars) sparPtsM.push([(s.x1 + s.x2) / 2, (s.z1 + s.z2) / 2]);
  const nearAny = (x, z, pts, d) => pts.some(p => Math.hypot(p[0] - x, p[1] - z) < d);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const v = i * 3;
      const wx = -bounds.w/2 + (c + 0.5) * step, wz = -bounds.h/2 + (r + 0.5) * step;
      let touchesVoid = false;
      for (let dr = -1; dr <= 1 && !touchesVoid; dr++) for (let dc = -1; dc <= 1; dc++) {
        const cc = c + dc, rr = r + dr;
        if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) continue;
        if (!land[rr * cols + cc]) { touchesVoid = true; break; }
      }
      if (!land[i]) { colors[v] = 0; colors[v+1] = 0; colors[v+2] = 0; continue; }
      const t = Math.min(1, heights[i] / 2);
      const c1 = sand.clone().lerp(rock, t * 0.8);
      // continuous world-space variation — never per-cell, or the terrain
      // reads as a checkerboard of tiles (critic: "visible grid seams")
      c1.multiplyScalar(0.96 + 0.07 * fbm2(wx * 0.10 + 3.7, wz * 0.10 - 1.9, 0x1234abcd));
      // slope shading: steep faces darken so dunes/rims read from distance
      {
        const cL = c > 0 ? heights[i - 1] : heights[i];
        const cR = c < cols - 1 ? heights[i + 1] : heights[i];
        const cU = r > 0 ? heights[i - cols] : heights[i];
        const cD = r < rows - 1 ? heights[i + cols] : heights[i];
        const slope = Math.hypot((cR - cL) / step, (cD - cU) / step);
        const s = Math.min(1, slope / 0.4);
        c1.multiplyScalar(1.0 - 0.28 * s + 0.10 * Math.max(0, s - 0.6));
        // steep faces read as rock, not sand (eroded-terrain trick)
        if (s > 0.45) c1.lerp(rock, (s - 0.45) * 0.5);
      }
      // warm sunlit banks at the water's edge
      if (touchesVoid && t < 0.5) c1.lerp(bankBoost, 0.42);
      // alluvial warmth in low interior basins
      else if (t < 0.28) c1.lerp(valleyWarm, (0.28 - t) * 0.8);
      // hydraulic-erosion gullies: high-frequency drainage channels carve
      // shallow grooves and darken the soil (skipped near gameplay points)
      let gy = heights[i];
      if (!touchesVoid && !nearAny(wx, wz, corePtsM, 7) && !nearAny(wx, wz, dockPtsM, 5)
          && !nearAny(wx, wz, [[map.dominion.x, map.dominion.z]], 8) && !nearAny(wx, wz, sparPtsM, 3)) {
        const gully = fbm2(wx * 0.22 + 8.2, wz * 0.22 - 5.7, gullySeed);
        if (gully < 0.36) {
          const gd = (0.36 - gully) * 1.4;
          gy = Math.max(-0.05, gy - gd);
          c1.lerp(gullyDark, (0.36 - gully) * 2.4);
        }
      }
      pos.setXYZ(i, wx, gy, wz);
      colors[v] = c1.r; colors[v+1] = c1.g; colors[v+2] = c1.b;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const landMat = new THREE.MeshStandardMaterial({ map: albedo, normalMap, normalScale: new THREE.Vector2(0.55, 0.55), vertexColors: true, roughness: 0.92, metalness: 0.0 });
  landMesh = new THREE.Mesh(geo, landMat);
  landMesh.castShadow = true; landMesh.receiveShadow = true;
  world.add(landMesh);

  // flank skirt: tapered carved underside with rock strata (not a gray slab)
  {
    const skirtPos = [], skirtCol = [];
    const strata = [new THREE.Color(0x1c1510), new THREE.Color(0x2a2017), new THREE.Color(0x352a1c)];
    const rimLit = new THREE.Color(0x9a8a72);
    const hazeBand = new THREE.Color(0x3a4658);
    const cw = bounds.w / cols, ch = bounds.h / rows;
    const xy = (c, r) => [-bounds.w/2 + c * cw, -bounds.h/2 + r * ch];
    const sRng = mulberry32(hashString(`strata-${map.starfield.seed}`));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        if (!land[i]) continue;
        for (const [dc, dr] of [[0,-1],[1,0],[0,1],[-1,0]]) {
          const cc = c + dc, rr = r + dr;
          if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) continue;
          if (land[rr * cols + cc]) continue;
          const [x0, z0] = xy(c, r);
          const [x1, z1] = xy(c + 1, r + 1);
          const top = heights[i];
          // tapered underside: inset grows with depth (carved rock cone).
          // The quad's top edge must BE the boundary edge for this direction —
          // otherwise twisted quads poke into the void (shadow-artifact read).
          let ax, az, bx, bz, ix, iz;
          if (dc === 1) { ax = x1; az = z0; bx = x1; bz = z1; ix = 15; iz = 0; }
          else if (dc === -1) { ax = x0; az = z0; bx = x0; bz = z1; ix = -15; iz = 0; }
          else if (dr === 1) { ax = x0; az = z1; bx = x1; bz = z1; ix = 0; iz = 15; }
          else { ax = x0; az = z0; bx = x1; bz = z0; ix = 0; iz = -15; }
          const pts = [
            [ax, top, az], [bx, top, bz], [bx + ix, -6, bz + iz], [ax + ix, -6, az + iz],
          ];
          const order = dc === 1 ? [0,1,2,0,2,3] : dc === -1 ? [2,1,0,3,2,0] : dr === 1 ? [0,1,2,0,2,3] : [2,1,0,3,2,0];
          for (const o of order) {
            const p = pts[o];
            skirtPos.push(p[0], p[1], p[2]);
            let col;
            if (p[1] > 0.2) col = rimLit;
            else {
              // blended strata: interpolate between bands so the underside
              // reads as carved rock, not stacked slats
              const ff = Math.max(0, Math.min(strata.length - 2, (-p[1] + sRng() * 1.1) / 1.15));
              const b = Math.floor(ff);
              const frac = ff - b;
              col = strata[b].clone().lerp(strata[b + 1], frac);
              // faint cool haze near the skirt's foot — the void's ambient
              // light, so the island's underside never reads as a black wall
              if (p[1] < -4.0) col.lerp(hazeBand, Math.min(1, (-4.0 - p[1]) * 0.5));
            }
            skirtCol.push(col.r, col.g, col.b);
          }
        }
      }
    }
    const sgeo = new THREE.BufferGeometry();
    sgeo.setAttribute('position', new THREE.Float32BufferAttribute(skirtPos, 3));
    sgeo.setAttribute('color', new THREE.Float32BufferAttribute(skirtCol, 3));
    sgeo.computeVertexNormals();
    skirtMesh = new THREE.Mesh(sgeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, side: THREE.DoubleSide }));
    world.add(skirtMesh);
  }

  // void floor (tracks the flank cone; reads as deep space)
  const fgeo = new THREE.PlaneGeometry(bounds.w + 8, bounds.h + 8);
  fgeo.rotateX(-Math.PI / 2);
  floorMesh = new THREE.Mesh(fgeo, new THREE.MeshBasicMaterial({ color: 0x0b0814 }));
  floorMesh.position.y = -6.02;
  world.add(floorMesh);

  // drifting debris in the void around the island (world space, parallax)
  {
    const rng = mulberry32(hashString(`debris-${map.starfield.seed}`));
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x3a4350, roughness: 0.85, metalness: 0.05, flatShading: true });
    for (let i = 0; i < 7; i++) {

      const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rockMat);

  // luminous coast rim band: a warm unlit lip hugging the water's edge
  {
    const rimPos = [];
    const rimMat = new THREE.MeshBasicMaterial({ color: 0xffcf7a, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
    const cw = bounds.w / cols, ch = bounds.h / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;

        const x0 = -bounds.w/2 + c * cw, z0 = -bounds.h/2 + r * ch;
        const hTop = Math.max(heights[i], 0.08) + 0.22;
        for (const [dc, dr] of [[0,-1],[1,0],[0,1],[-1,0]]) {
          const cc = c + dc, rr = r + dr;
          if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) continue;
          if (land[rr * cols + cc]) continue;
          const x1 = x0 + cw, z1 = z0 + ch;
          if (dc === 1) rimPos.push(x1, 0.04, z0, x1, hTop, z0, x1, hTop, z1, x1, 0.04, z0, x1, hTop, z1, x1, 0.04, z1);
          else if (dc === -1) rimPos.push(x0, 0.04, z0, x0, hTop, z1, x0, hTop, z0, x0, 0.04, z0, x0, 0.04, z1, x0, hTop, z1);
          else if (dr === 1) rimPos.push(x0, 0.04, z1, x1, hTop, z1, x0, hTop, z1, x0, 0.04, z1, x1, 0.04, z1, x1, hTop, z1);
          else rimPos.push(x0, 0.04, z0, x0, hTop, z0, x1, hTop, z0, x0, 0.04, z0, x1, hTop, z0, x1, 0.04, z0);
        }
      }
    }
    if (rimPos.length) {
      const rgeo = new THREE.BufferGeometry();
      rgeo.setAttribute('position', new THREE.Float32BufferAttribute(rimPos, 3));
      world.add(new THREE.Mesh(rgeo, rimMat));
    }
  }

  // causeway spars: woven golden decks with a luminous seam
  const weave = document.getElementById('weave').checked;
  const deckMat = new THREE.MeshStandardMaterial({ color: 0xd8b060, roughness: 0.35, metalness: 0.55 });
  const kerbMat = new THREE.MeshStandardMaterial({ color: 0xb09050, roughness: 0.4, metalness: 0.6 });
  const seamMat = new THREE.MeshStandardMaterial({ color: 0xffe0a0, emissive: 0xffb347, emissiveIntensity: 1.05, roughness: 0.4 });
  for (const lane of map.causeways) {
    if (lane.dormant && !weave) continue;
    for (const s of lane.spars) {
      const len = Math.hypot(s.x2 - s.x1, s.z2 - s.z1);
      const mx = (s.x1 + s.x2) / 2, mz = (s.z1 + s.z2) / 2;
      const ang = Math.atan2(s.x2 - s.x1, s.z2 - s.z1);
      const deck = new THREE.Mesh(new THREE.BoxGeometry(len, 0.12, 1.6), deckMat);
      deck.position.set(mx, 0.06, mz); deck.rotation.y = ang; deck.receiveShadow = true;
      sparGroup.add(deck);
      const seam = new THREE.Mesh(new THREE.BoxGeometry(len * 0.94, 0.045, 0.24), seamMat);
      seam.position.set(mx, 0.14, mz); seam.rotation.y = ang;
      sparGroup.add(seam);
      for (const off of [-0.72, 0.72]) {
        const kerb = new THREE.Mesh(new THREE.BoxGeometry(len, 0.06, 0.16), kerbMat);
        kerb.position.set(mx + Math.sin(ang) * off, 0.14, mz + Math.cos(ang) * off);
        kerb.rotation.y = ang;
        sparGroup.add(kerb);
      }
      // woven cross-struts
      const struts = Math.max(1, Math.floor(len / 2.2));
      for (let k = 1; k <= struts; k++) {
        const t = k / (struts + 1);
        const strut = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 1.5), kerbMat);
        strut.position.set(mx + (s.x2 - s.x1) * (t - 0.5), 0.12, mz + (s.z2 - s.z1) * (t - 0.5));
        strut.rotation.y = ang;
        sparGroup.add(strut);
      }
    }
  }

  // cores — Sunwoven ivory/gold luminous pavilion; Gravemark slate/copper keep
  const sparkTex = radialTexture(3, 18, 48);
  const buildCore = (x, z, faction) => {
    const g = new THREE.Group();
    if (faction === 'sunwoven') {
      const ivory = new THREE.MeshStandardMaterial({ color: 0xf2e8d2, roughness: 0.5, metalness: 0.1 });
      const gold = new THREE.MeshStandardMaterial({ color: 0xe8a33d, roughness: 0.32, metalness: 0.85, emissive: 0x8a5a1a, emissiveIntensity: 0.5 });
      const glowGold = new THREE.MeshStandardMaterial({ color: 0xffd98a, emissive: 0xffb347, emissiveIntensity: 1.15, roughness: 0.4 });
      const turq = new THREE.MeshStandardMaterial({ color: 0x3fc4b4, roughness: 0.5, emissive: 0x1a7a6e, emissiveIntensity: 0.5, side: THREE.DoubleSide });
      // stepped plinth with filigree rings and dark shadow grooves between tiers
      const dark = new THREE.MeshStandardMaterial({ color: 0x2a1f14, roughness: 0.9 });
      const t1 = new THREE.Mesh(new THREE.CylinderGeometry(4.1, 4.5, 0.45, 40), ivory); t1.position.y = 0.22;
      const g1 = new THREE.Mesh(new THREE.TorusGeometry(3.95, 0.1, 6, 48), dark); g1.rotation.x = Math.PI / 2; g1.position.y = 0.48;
      const t2 = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.7, 0.4, 40), ivory); t2.position.y = 0.65;
      const g2 = new THREE.Mesh(new THREE.TorusGeometry(3.15, 0.1, 6, 40), dark); g2.rotation.x = Math.PI / 2; g2.position.y = 0.9;
      // tier-edge gold studs (no full rings: those read as selection UI)
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), gold);
        s1.position.set(Math.cos(a) * 4.3, 0.5, Math.sin(a) * 4.3);
        g.add(s1);
        const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), gold);
        s2.position.set(Math.cos(a) * 3.5, 0.9, Math.sin(a) * 3.5);
        g.add(s2);
      }
      // drum with luminous seam and glow studs
      const drum = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.8, 1.5, 40), ivory); drum.position.y = 1.5;
      const seam = new THREE.Mesh(new THREE.TorusGeometry(2.65, 0.07, 8, 48), glowGold); seam.rotation.x = Math.PI / 2; seam.position.y = 1.52;
      const gDrum = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.08, 6, 40), dark); gDrum.rotation.x = Math.PI / 2; gDrum.position.y = 2.28;
      for (let i = 0; i < 4; i++) {

        strip.position.set(Math.cos(a) * 2.62, 1.5, Math.sin(a) * 2.62);
        g.add(strip);
      }
      // fabric canopy — warm saffron block, gold trim, ribs, spire
      const saffron = new THREE.MeshStandardMaterial({ color: 0xe0a33d, roughness: 0.55, emissive: 0x5a3a08, emissiveIntensity: 0.25 });
      const canopy = new THREE.Mesh(new THREE.SphereGeometry(2.5, 30, 14, 0, Math.PI * 2, 0, Math.PI * 0.58), saffron); canopy.position.y = 3.1;
      const trim = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.11, 10, 48), gold); trim.rotation.x = Math.PI / 2; trim.position.y = 3.14;
      const saffronBand = new THREE.Mesh(new THREE.TorusGeometry(2.32, 0.3, 10, 48), saffron); saffronBand.rotation.x = Math.PI / 2; saffronBand.position.y = 3.4;
      const filigree = new THREE.Mesh(new THREE.TorusGeometry(2.28, 0.05, 6, 48), glowGold); filigree.rotation.x = Math.PI / 2; filigree.position.y = 3.7;
      for (let i = 0; i < 10; i++) {

        rib.position.set(Math.cos(a) * rr, ry, Math.sin(a) * rr);

        rib.rotation.x = -Math.sin(a) * 0.62;
        g.add(rib);
      }
      const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.16, 2.3, 8), gold); spire.position.y = 5.0;
      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 10), glowGold); finial.position.y = 6.4;
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, color: 0xffd98a, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
      halo.position.y = 6.5; halo.scale.set(3.2, 3.2, 1);
      for (const o of [t1, g1, t2, g2, drum, seam, gDrum, canopy, trim, saffronBand, filigree, spire, finial]) { o.castShadow = true; g.add(o); }
      g.add(halo);
      // turquoise banner streamers — big enough to register at opening zoom
      const turqBright = new THREE.MeshStandardMaterial({ color: 0x46d4c4, roughness: 0.45, emissive: 0x1a8a7a, emissiveIntensity: 0.9, side: THREE.DoubleSide });
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + 0.3;
        const banner = new THREE.Mesh(new THREE.BoxGeometry(0.62, 2.4, 0.05), turqBright);
        banner.position.set(Math.cos(a) * 2.42, 1.75, Math.sin(a) * 2.42);
        banner.rotation.y = a;
        g.add(banner);
        const finialTip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 4), gold);
        finialTip.position.set(Math.cos(a) * 2.42, 3.0, Math.sin(a) * 2.42);
        g.add(finialTip);
      }
      // contact shadow under the pavilion
      const cshadow = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTexture(4, 26, 64, '0,0,0'), transparent: true, opacity: 0.3, depthWrite: false }));
      cshadow.position.y = 0.06; cshadow.scale.set(10.5, 10.5, 1);
      g.add(cshadow);
      // floating sparks around the pavilion
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2;
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, color: 0xffcf7a, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
        sp.position.set(Math.cos(a) * 4.6 + Math.sin(i * 7.3) * 0.8, 1.1 + Math.sin(i * 3.1) * 0.7, Math.sin(a) * 4.6 + Math.cos(i * 5.7) * 0.8);
        sp.scale.set(0.8, 0.8, 1);
        g.add(sp);

      // plaza inlay — diagonal woven strips (asymmetric, no radial pattern)

      const strips = [[0.5, 0.9], [2.4, -0.5], [4.0, 2.0], [5.6, 1.1]];
      for (const [ang, off] of strips) {

        strip.position.set(Math.cos(ang) * 2.6 + Math.sin(ang) * off, 0.045, Math.sin(ang) * 2.6 + Math.cos(ang) * off);
        strip.rotation.y = -ang + rayRng() * 0.25;

      const slate = new THREE.MeshStandardMaterial({ color: 0x5a6672, roughness: 0.65, metalness: 0.25 });
      const copper = new THREE.MeshStandardMaterial({ color: 0xb0713f, roughness: 0.35, metalness: 0.7, emissive: 0x5a2f10, emissiveIntensity: 0.5 });

      const f1 = new THREE.Mesh(new THREE.TorusGeometry(4.3, 0.1, 8, 40), copper); f1.rotation.x = Math.PI / 2; f1.position.y = 0.46;
      const keep = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 3.1, 2.3, 8), slate); keep.position.y = 1.6;
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const strip = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.2, 0.16), glowCopper);
        strip.position.set(Math.cos(a) * 2.72, 1.6, Math.sin(a) * 2.72);
        g.add(strip);
      }
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 2.4, 0.5, 8), copper); cap.position.y = 3.0;
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.45, 2.1, 8), glowCopper); spike.position.y = 4.3;
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, color: 0xffa060, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending, depthWrite: false }));
      halo.position.y = 4.4; halo.scale.set(3.2, 3.2, 1);
      for (const o of [t1, f1, keep, cap, spike]) { o.castShadow = true; g.add(o); }
      g.add(halo);
      const g2rng = mulberry32(hashString(`g2rays-${map.starfield.seed}`));
      const g2rayMat = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, emissive: 0x4a2f10, emissiveIntensity: 0.3, transparent: true, opacity: 0.6, depthWrite: false });
      for (let i = 0; i < 13; i++) {
        const a = (i / 13) * Math.PI * 2 + g2rng() * 0.3;
        const len = 1.8 + g2rng() * 2.2;

        ray.position.set(Math.cos(a) * (5.9 + len / 2), 0.045, Math.sin(a) * (5.9 + len / 2));
        ray.rotation.y = -a;
        g.add(ray);
      }
    }
    g.position.set(x, 0, z);
    propGroup.add(g);
  };
  for (const core of map.cores) buildCore(core.x, core.z, core.faction);

  // Dominion spire — monumental broken-ring base + pillar (no closed rings)
  {
    const g = new THREE.Group();

    for (let i = 0; i < 4; i++) {

    const plinth = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.6, 0.6, 24), new THREE.MeshStandardMaterial({ color: 0x9a8a6a, roughness: 0.6 }));
    plinth.position.y = 0.3;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.75, 6.2, 16), new THREE.MeshStandardMaterial({ color: 0xd8c48a, roughness: 0.3, metalness: 0.4, emissive: 0x8a743a, emissiveIntensity: 0.4 }));
    shaft.position.y = 3.7;

    halo.position.y = 7.1; halo.scale.set(9, 9, 1);

    for (const o of [plinth, shaft, head, halo]) g.add(o);

  // deposit nodes: rock plinth + crystal cluster + glow
  for (const d of map.deposits) {
    const g = new THREE.Group();
    let hsh = 2166136261;
    for (const ch of d.id) hsh = Math.imul(hsh ^ ch.charCodeAt(0), 16777619);
    const rng = () => { hsh = Math.imul(hsh ^ (hsh >>> 15), 2246822519); hsh = Math.imul(hsh ^ (hsh >>> 13), 3266489917); return ((hsh >>> 16) & 0xffff) / 65536; };
    const n = 3 + ((rng() * 4) | 0);
    const col = DEPOSIT_KINDS[d.kind].color;
    const plinth = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.5, 0.35, 10), new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.9, flatShading: true }));
    plinth.position.y = 0.18; plinth.receiveShadow = true;

  // docks: lattice piers + teal lantern + void ring
  const pierMat = new THREE.MeshStandardMaterial({ color: 0xb09a6a, roughness: 0.6, metalness: 0.15 });
  const postMat = new THREE.MeshStandardMaterial({ color: 0x6a5a3a, roughness: 0.7 });

  for (const dk of map.docks) {

    g.add(lglow);
