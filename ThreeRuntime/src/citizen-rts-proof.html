<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunfold Milestone 1 — 32 Citizen RTS proof</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a3a28; color: #e8e0d0; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    #proof-root { position: absolute; inset: 0; }
    #hud {
      position: absolute; left: 12px; top: 12px; z-index: 2;
      background: rgba(12,18,10,0.78); padding: 10px 12px; border: 1px solid #5a6a48; max-width: 420px;
    }
    #hud strong { color: #e2b866; }
    button { margin: 4px 4px 0 0; cursor: pointer; }
    .hint { margin-top: 8px; opacity: 0.75; }
    #minimap-wrap {
      position: absolute; right: 14px; bottom: 14px; z-index: 3;
      width: 168px; height: 168px;
      border: 1px solid #7a8a58;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      background: rgba(18, 28, 14, 0.92);
      border-radius: 2px;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
    }
    #minimap {
      display: block; width: 100%; height: 100%;
    }
    #minimap-label {
      position: absolute; left: 6px; top: 4px;
      font-size: 10px; letter-spacing: 0.04em;
      color: #c8d4a8; opacity: 0.85; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="proof-root"></div>
  <div id="hud">
    <div><strong>Milestone 1</strong> — sprite Citizen RTS proof</div>
    <div id="status">loading…</div>
    <div id="fps" style="margin-top:4px;color:#9dcea0;">FPS —</div>
    <div>
      <button id="start-activities" type="button">Start activities</button>
      <button id="select-walkers" type="button">select walkers</button>
      <button id="toggle-rotate" type="button">toggle slow cam rotate (off)</button>
    </div>
    <div class="hint">
      Default: all 32 idle standing (no walk). Press Start activities or <kbd>A</kbd> for the 16/8/4/4 demo.
      Wheel/pinch: smooth zoom · Middle/right-drag or WASD/arrows: pan · Click minimap to jump.
    </div>
  </div>
  <div id="minimap-wrap" title="Click or drag to pan camera">
    <canvas id="minimap" width="168" height="168"></canvas>
    <div id="minimap-label">MAP</div>
  </div>
  <script src="./citizen-rts-proof.bundle.js"></script>
</body>
</html>
