<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunfold — Sunwoven sprite lab (AoE2 path)</title>
  <style>
    body { margin: 0; background: #050711; color: #f5e7c2; font: 12px/1.4 -apple-system, sans-serif; }
    #sprite-root { position: fixed; inset: 0; cursor: grab; }
    #sprite-root canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none; }
    #hud span { background: rgba(5, 7, 17, 0.78); padding: 4px 8px; border: 1px solid rgba(245, 231, 194, 0.25); max-width: 100%; }
    #camera-spec { font-family: ui-monospace, monospace; font-size: 10px; color: #9ab5d9; }
  </style>
</head>
<body>
  <div id="sprite-root"></div>
  <div id="hud">
    <span id="status">loading</span>
    <span id="unit-name">sunwoven-weaver</span>
    <span id="current-clip">idle</span>
    <span id="facing">S (0)</span>
    <span>Keys: 1 idle · 2 walk (straight line) · 3 gather · 4 build · ←→ facing · space pause · U switch unit · drag pan · wheel zoom</span>
    <span id="camera-spec"></span>
  </div>
  <script>
    window.addEventListener("error", (e) => {
      const s = document.getElementById("status");
      if (s) s.textContent = "ERR: " + e.message;
    });
    window.addEventListener("unhandledrejection", (e) => {
      const s = document.getElementById("status");
      if (s) s.textContent = "REJECT: " + e.reason;
    });
  </script>
  <script src="sprite-lab.bundle.js?v=1785857373078"></script>
</body>
</html>
