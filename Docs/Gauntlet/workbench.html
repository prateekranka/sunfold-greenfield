<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sunfold Gauntlet — workbench</title>
<style>
  :root {
    color-scheme: dark;
    --bg:      #08090e;
    --panel:   #12141d;
    --panel2:  #171a25;
    --line:    #232739;
    --ink:     #e9e5da;
    --mute:    #8b8798;
    --dim:     #64607040;
    --gold:    #c9a24a;
    --teal:    #4fb3ae;
    --ok:      #63c07a;
    --warn:    #d9a441;
    --bad:     #d8615c;
  }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-bottom: 64px;
  }
  a { color: var(--teal); }
  code, .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 0.88em;
  }
  code { color: var(--gold); }

  header {
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #101320 0%, var(--bg) 100%);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(12px);
  }
  header h1 { margin: 0 0 4px; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--mute); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--mute);
  }
  .chip.gold { color: var(--gold); border-color: #4a3c1c; }

  main { padding: 20px 16px; display: grid; gap: 26px; max-width: 1180px; margin: 0 auto; }
  section > h2 {
    margin: 0 0 12px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em; color: var(--mute);
  }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .card.now { border-color: #3d3520; background: linear-gradient(180deg, #191507 0%, var(--panel) 55%); }
  .card h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .card p  { margin: 0 0 10px; }
  .card p:last-child { margin-bottom: 0; }
  .why { color: #c8c3d2; }
  .meta { color: var(--mute); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
  .gap {
    margin-top: 12px; padding: 10px 12px; border-left: 2px solid var(--bad);
    background: #1d1216; border-radius: 0 8px 8px 0; color: #e5cfcf; font-size: 14px;
  }

  ol.queue { list-style: none; counter-reset: q; margin: 0; padding: 0; display: grid; gap: 10px; }
  ol.queue li {
    counter-increment: q; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 16px 13px 46px; position: relative;
  }
  ol.queue li::before {
    content: counter(q); position: absolute; left: 14px; top: 13px;
    width: 20px; height: 20px; border-radius: 50%; background: var(--panel2);
    border: 1px solid var(--line); color: var(--mute);
    font-size: 11px; line-height: 19px; text-align: center;
  }
  ol.queue strong { font-weight: 600; }
  ol.queue .why { display: block; color: var(--mute); font-size: 13.5px; margin-top: 3px; }

  .bars { display: grid; gap: 8px; }
  .bar {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; display: grid; gap: 4px;
    grid-template-columns: 70px 1fr auto; align-items: start;
  }
  .bar .id { font-size: 12px; color: var(--gold); font-weight: 600; grid-row: 1 / span 3; }
  .bar .axis { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--mute); }
  .bar .what { font-size: 14px; }
  .bar .state {
    grid-row: 1 / span 3; font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 5px; white-space: nowrap;
  }
  .state.pass       { color: var(--ok);   background: #143020; }
  .state.fail       { color: var(--bad);  background: #2c1618; }
  .state.unmeasured { color: var(--mute); background: var(--panel2); }
  .bar .nums { font-size: 12.5px; color: var(--mute); grid-column: 2 / 3; }
  .bar .nums b { color: #cfcad9; font-weight: 500; }

  details.entry {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; margin-bottom: 8px;
  }
  details.entry > summary {
    padding: 13px 16px; cursor: pointer; list-style: none;
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--mute); font-size: 11px; transform: translateY(-1px);
  }
  details.entry[open] > summary::before { content: "▾"; }
  summary .cp    { color: var(--gold); font-weight: 600; font-size: 13px; }
  summary .title { font-weight: 550; }
  summary .date  { color: var(--mute); font-size: 12px; margin-left: auto; }
  .entry .body { padding: 0 16px 16px; display: grid; gap: 12px; }
  .entry dl { margin: 0; display: grid; gap: 10px; }
  .entry dt {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--mute); margin-bottom: 2px;
  }
  .entry dd { margin: 0; }
  .proof {
    display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px;
    padding-top: 10px; border-top: 1px solid var(--line);
  }
  .proof span { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; color: var(--mute); }
  .proof .st-local      { color: var(--warn); }
  .proof .st-testflight { color: var(--teal); }
  .proof .st-appstore   { color: var(--ok); }

  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ba.single { grid-template-columns: 1fr; }
  figure { margin: 0; background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption {
    padding: 6px 9px; font-size: 10.5px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--mute); background: var(--panel2);
  }

  .lease { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }

  .note { color: var(--mute); font-size: 12.5px; }
  .err { color: var(--bad); }

  @media (max-width: 640px) {
    main { padding: 16px 12px; gap: 22px; }
    .bar { grid-template-columns: 56px 1fr; }
    .bar .state { grid-row: auto; grid-column: 2; justify-self: start; margin-top: 4px; }
    .ba { grid-template-columns: 1fr; }
    summary .date { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1 id="hTitle">Sunfold Gauntlet</h1>
  <div class="sub" id="hSub">loading…</div>
  <div class="chips" id="hChips"></div>
</header>

<main>
  <section>
    <h2>Now</h2>
    <div id="now"></div>
  </section>

  <section>
    <h2>Next three</h2>
    <ol class="queue" id="next"></ol>
  </section>

  <section>
    <h2>The bars</h2>
    <div class="bars" id="bars"></div>
    <p class="note" style="margin-top:10px">
      A bar may not be edited by anyone being judged against it. Changing one is its own
      checkpoint, requires the human, and records the old and new numbers side by side.
    </p>
  </section>

  <section>
    <h2>Simulator lease</h2>
    <div class="card"><div class="lease" id="lease"></div></div>
  </section>

  <section>
    <h2>Shipped</h2>
    <div id="log"></div>
  </section>
</main>

const FALLBACK = /* INLINE_DATA_START */ {"meta": {"updated": "2026-07-31T20:34:34+05:30", "version": "0.3.0", "build": 42, "branch": "visual/aaa-uplift-cp02", "wave": 2, "waveTitle": "Make it a game — production, combat, an opponent, a result"}, "now": {"piece": "CP-C3", "title": "Adversary v0 — and the thing that makes combat verifiable", "why": "Gravemark has a Core, buildings and units, and does nothing with any of them for the entire match. There is nothing to play against, no way to lose, and — discovered while trying to verify CP-C2 — no way to observe combat at all, because two hostile units never come into contact. A deterministic scheduled opponent (gather, train to 12, Formation Yard at 2:00, rising attack waves) is worth more than a clever one: a player can learn to beat it, and it replays identically so a test can trust it. It also closes CP-C2.", "owner": "director — next builder not yet dispatched", "model": "composer-2.5", "started": "2026-07-31T21:30:00+05:30", "round": 0, "lastCriticVerdict": "n/a"}, "next": [{"piece": "CP-C4", "title": "Victory and defeat", "why": "The simulation still has no way to end. The locked promise is two win paths and an 8-10 minute match. Nobody has ever played this to a result."}, {"piece": "CP-C2′", "title": "Close combat on device", "why": "Combat is built and 39 tests pass, but no fight has been seen in play. Fold the device capture into CP-C3, where an attack wave arrives on its own. Do not close CP-C2 without a capture of HP falling and a unit dying."}, {"piece": "CP-C5", "title": "Military roster breadth", "why": "Directive 3. Six UnitKind cases exist; the spec calls for scout, infantry, ranged, mounted and siege lines with a real counter triangle. Worthless before combat is proven, essential immediately after."}], "bars": [{"id": "B1a", "axis": "Visual fidelity", "bar": "Blind A/B against concept 01, both frames normalised to identical size and aspect", "target": "Critic picks ours, or names only a cosmetic gap", "current": "Not yet run with normalised pairs", "state": "unmeasured", "evidence": "tools/framestat.py"}, {"id": "B1b", "axis": "Visual fidelity", "bar": "Frame composition statistics vs concept 01, HUD masked", "target": "void ≥ 0.35 · black point ≤ 0.010 · range ≥ 0.48 · sat ≥ 0.42 · hue share ≤ 0.80", "current": "void 0.025 · black point 0.102 · range 0.451 · sat 0.367 · hue share 0.835 — fails four of five", "state": "fail", "evidence": "../QA/AAA/sparse-map1-riverlands.png"}, {"id": "B2a", "axis": "Performance", "bar": "iPad Air 13-inch (M2), Release, Instruments: p50 ≤ 12 ms and p99 ≤ 16.67 ms at 8 / 20 / 40 / 80 units. The Air is 60 Hz, not ProMotion, so 16.67 ms is the true budget — report p95/p99 and the share of frames over it, not the mean", "target": "Pass at every density rung", "current": "No device, no Release build, no percentile has ever been captured", "state": "unmeasured", "evidence": "../research/ipad-realitykit-60fps-budget.md"}, {"id": "B2a-floor", "axis": "Performance", "bar": "60 fps on the weakest iPad the deployment target admits, not just on the dev device", "target": "A12 Bionic / 3 GB (iPad Air 3, iPad 8th gen, iPad mini 5) holds 60 fps — or the admitted device set is deliberately narrowed", "current": "Unaddressed. iOS 26.0 + iPad-only admits every iPadOS 26 iPad down to A12/3GB, several generations below the M2/8GB dev device, while the app runs 4x MSAA and a full-res post composite", "state": "fail", "evidence": "03-LAUNCH-GATE.md"}, {"id": "B2b", "axis": "Performance", "bar": "Simulator regression: p99 may not rise more than 5% per checkpoint on the same scenario", "target": "≤ +5% per checkpoint", "current": "Harness landing now (-sunfoldPerf); no baseline recorded yet", "state": "unmeasured", "evidence": "../../scripts/perf-scenarios.json"}, {"id": "B2c", "axis": "Performance", "bar": "Ten minutes on the iPad Air 13-inch (M2) without thermal throttling", "target": "thermalState never .serious; final minute ≥ 58 fps", "current": "Never run", "state": "unmeasured", "evidence": null}, {"id": "B3a", "axis": "Game feel", "bar": "Response latency counted in frames from a 60 fps recording, via the latency probe", "target": "Acknowledgment ≤ 2 frames; committed state ≤ 6 frames, all six verbs", "current": "Probe does not exist yet (P0.4)", "state": "unmeasured", "evidence": null}, {"id": "B3b", "axis": "Game feel", "bar": "Activity legibility — name each unit's activity from a silent HUD-cropped clip", "target": "≥ 90% correct over ≥ 20 observations", "current": "Fails by construction: EntityPresenter reads unit.activity only for .boarding, so gather, construct and idle are the same frozen pose", "state": "fail", "evidence": "../../Sources/Rendering/EntityPresenter.swift"}, {"id": "B3d", "axis": "Game feel", "bar": "Every verb answers with a distinct cue within 100 ms; committing verbs are haptic", "target": "Zero silent verbs, zero missing haptics", "current": "Three system beeps total; no haptics anywhere in Sources/", "state": "fail", "evidence": "../../Sources/Audio/FeedbackAudio.swift"}, {"id": "B4b", "axis": "UI / HUD craft", "bar": "Every HUD text run ≥ 4.5:1 contrast; no glyph under 11 pt at 2×", "target": "Zero violations", "current": "Not measured", "state": "unmeasured", "evidence": null}, {"id": "B4c", "axis": "UI / HUD craft", "bar": "No dead chrome, no lying chrome, no stale alerts", "target": "Zero", "current": "The alert 'Light transport docked at home rim' persists across five committed captures; control-group slots are chrome only", "state": "fail", "evidence": "../QA/AAA/cp11-pier.png"}, {"id": "B5a", "axis": "RTS depth", "bar": "The glance test — five questions answered from one still frame at default zoom", "target": "5 of 5", "current": "1 of 5 against the current baseline capture", "state": "fail", "evidence": "../QA/AAA/sparse-map1-riverlands.png"}, {"id": "B5b", "axis": "RTS depth", "bar": "Three unassisted playthroughs end in a win or a loss in 8–10 minutes", "target": "3 of 3", "current": "Unreachable — the simulation has no victory or defeat condition", "state": "fail", "evidence": "../../ROADMAP.md"}, {"id": "B6", "axis": "Correctness", "bar": "DeterminismTests green under swift test, plus a byte-identical seeded replay", "target": "Green every checkpoint", "current": "Never executed. ConstructionIntegrityTests does run — 10/10 on branch cursor/cp-g2a-r2-construction-integrity-a2b9 — so the tooling exists", "state": "unmeasured", "evidence": "../QA/G2/cp-g2a/staged-build-proof.md"}], "log": [{"id": "CP-C2", "date": "2026-07-31", "title": "Combat core — built, tested, and deliberately NOT closed", "changed": "New Sources/Simulation/CombatSystem.swift and Sources/Domain/CombatTypes.swift: armour-class damage with a minimum floor, integer-tick cooldowns on the fixed 20 Hz step, deterministic target acquisition tie-broken by EntityID, melee pathing into range, death that frees population, building destruction that cancels a production queue with a full refund. No randomness added, so no new tagged stream and no shift to any existing subsystem's numbers. Tapping a hostile with military units selected issues an attack order through the existing SelectionModel path. 39 tests pass, up from 31.", "taught": "The verification boundary, and it is the most useful thing in this entry. Combat compiles green, 39 tests pass, and the build installs and renders on the iPad — and none of that is a player watching a unit die. No fight can be staged, because the only hostiles are Gravemark's and Gravemark has no AI: nothing ever comes at you, so two hostile units never meet. This project has twice been misled by exactly this shape of evidence — a 10/10 test pass that never executed, and three sessions of green builds while a third of the map rendered magenta. So CP-C2 is committed and explicitly left open. Verification folds into CP-C3 adversary, where hostile units arrive on their own.", "evidence": "Docs/QA/G3/cp-c2/STATUS.md states exactly what is and is not proven. Build log build-agents/combat.log:1328. Landscape capture of the combat build running.", "verdict": "IN FLIGHT — not shipped"}, {"id": "CP-C1", "date": "2026-07-31", "title": "Production — the game can now make a unit", "changed": "New Sources/Simulation/ProductionSystem.swift: per-building FIFO queue, cost charged on enqueue, progress counted in integer ticks on the fixed 20 Hz step, deterministic ring spawn resolved through WorldMap, 100%/75% cancel refund split. Queued units reserve population so the cap cannot be overshot by queueing. CommandGrid became selection-aware — a production building offers what it trains with a live cost badge, a Citizen offers the build menu — and every unavailable tile now states its own reason instead of being silently dark. Formation Yard, Expansion Outpost and Dawn Loom got build tiles. Population cap 8 to 10, Dwelling grant 4 to 8.", "taught": "Three things existed in the domain that nothing could reach. BuildingKind.trains declared what every building makes and no code read it. SkirmishTuning.maxQueueLength and cancelRefundFraction were both dead. Formation Yard, Expansion Outpost and Dawn Loom were BuildingKind cases with no build tile, and because Dawn Loom gates the Voyager age, the second age was unreachable in a shipped build. A declared-but-unwired constant is worse than a missing one: it reads as done in the source and is invisible on device. The dimmed-tile-with-a-reason pattern is the fix that generalises — the refusal on device reads \"Citizen. Needs 4.11 Provisions.\", an exact live number, so the player is never guessing why a button is dark.", "evidence": "Docs/QA/G3/cp-c1/ — 6 landscape captures: Core selected with Train tile, pop 4/10 to 5/10 to 7/10 across three queued Citizens, all three spawned, the refusal tile, and the six-entry Citizen build menu.", "verdict": "SHIPPED"}, {"id": "CP-G3a2", "date": "2026-07-31", "title": "Cross-region traversal — the structural gap the critic found", "changed": "MovementSystem no longer clamps a land unit to the region it spawned in. Unit.region becomes a derived label rather than a movement constraint. Land is land; water still needs a boat. BoardingSystem widened so military units can ride a transport, and disembark restores the derived region. Two new determinism tests prove a land unit walks from the home region into the Dominion over continuous ground, and still cannot cross void water.", "taught": "This was not on any plan. The content-spec critic found it by compiling a probe against the real simulation rather than reading the code, and it invalidated three separate designs at once: Conquest needs you to reach the enemy base, Dominion needs you to hold remote nodes, and the Aether gate needs you to reach it. All three were specified against a simulation that physically could not deliver a unit to another region. The lesson is about the review method, not the bug — a critic who runs the code finds things a critic who reads it cannot.", "evidence": "Tests/DeterminismTests.swift — two new tests, part of the 31 passing under `swift test`.", "verdict": "SHIPPED"}, {"id": "CP-G2b-NAV", "date": "2026-07-31", "title": "Camera navigation — the minimap was a picture", "changed": "Minimap tap-to-jump and drag-to-scrub. Face north, Go to Core and Expand map wired to real actions. Place marker is dimmed and labelled rather than left as a live-looking tile for a feature that does not exist.", "taught": "Found by playing, not by reading. The minimap had no gesture recogniser of any kind and its four tool tiles had no actions, so drag-pan was the only way to move the camera on a map that takes ten seconds to cross. Nothing in the code was broken — the code was absent, and the HUD looked complete enough that four separate reviews had walked past it. An honest dimmed tile beats a dead live one.", "evidence": "Docs/QA/G2/cp-g2b-nav/ — camera panned to the map rim, then one tap on Go to Core returns to the Core.", "verdict": "SHIPPED"}, {"id": "P4", "date": "2026-07-31", "title": "Pose caching — the one authorised perf change", "changed": "EntityPresenter caches the seven per-unit findEntity(named:) limb lookups at spawn instead of walking the RealityKit entity hierarchy every frame for every unit.", "taught": "Directive 2 demoted performance to a guardrail and named this the single exception, because it is invisible, zero-visual-risk and buys headroom for the larger unit counts a bigger roster implies. Timeboxed to one checkpoint and closed in one. Recording it here so no later agent reopens it as a perf programme.", "evidence": "Compiles green; 31 tests pass. No perf claim is made — none was measured, and per BC-02 none was required.", "verdict": "SHIPPED"}, {"id": "REVIEW-01", "date": "2026-07-31", "title": "Content spec critique — REVISE, and the finding that reordered the plan", "changed": "Nothing in the game. A fresh critic on claude-opus-5-thinking-max reviewed the five Docs/Design files against the real code and compiled two throwaway probes — an economy probe running the real SkirmishSimulation at 20 Hz, and a combat probe implementing the spec's own damage model — so every number in the review was measured rather than estimated.", "taught": "The largest finding was not a balance number. Unit.region is assigned at spawn and never updated, while MovementSystem clamps every land unit to its own region — so no unit has ever been able to leave the region it spawned in. A citizen ordered to the Dominion moved 21.7 m of an 816 m budget over continuous dry land and stopped at the seam. Conquest, Dominion and the Aether age gate were all unreachable for that one reason, and three serial checkpoints would each have passed their own bar before anyone noticed. I verified it myself before acting on it. Beyond that: the damage formula as written gave every archer the siege unit's +45 vs building; two files disagreed about the armour class of four of nine units in a way that inverted five matchups; the home fragment was 342 Matter short of its own building list; real gather income measured 39-59% of the book rate the costs were priced against; and three Warding Posts left a Bastion Walker at 190 of 190 HP because a damage bonus cannot answer a range deficit.", "next": "Traversal shipped as CP-G3a2, then re-author the spec against 05-RESOLUTIONS-R1 and run a second critic round before any roster content is built.", "proof": {"version": "0.3.0", "build": 42, "play": "Docs/Design/REVIEW-01-content-spec.md + 05-RESOLUTIONS-R1.md", "status": "local"}, "before": null, "after": null}, {"id": "DESIGN-01", "date": "2026-07-31", "title": "Content design specification + bar changes BC-01 and BC-02", "changed": "Authored Docs/Design/ — 00-CONTENT-SPEC (principles, two tiers, faction split, victory), 01-UNIT-ROSTER (nine unit kinds, counter triangle, full stat and time-to-kill tables), 02-BUILDING-ROSTER (fourteen buildings, each unlocking something concrete, production model, two-page command grid), 03-COMBAT-MODEL (damage formula, armour classes, tick resolution, no RNG in combat at all), 04-IMPLEMENTATION-ORDER (nine checkpoints ranked by player-visible impact). Recorded the human's bar change from Age of Empires IV to Age of Empires II: The Rise of Rome in space as BC-01, and the demotion of performance to a guardrail as BC-02, both in 00-PLAN.md with old and new side by side.", "taught": "Writing the roster forced the arithmetic, and the arithmetic found the real state of the game: the implementation order I first drafted started with combat, and playing the build showed production is missing too — which is more basic. The order was rewritten before any of it was built.", "next": "Fresh critic on claude-opus-5-thinking-max reviews the spec before any roster content is implemented.", "proof": {"version": "0.3.0", "build": 42, "play": "Docs/Design/ + Docs/Gauntlet/00-PLAN.md bar-change log", "status": "local"}, "before": null, "after": null}, {"id": "CP-G2a-R3", "date": "2026-07-31", "title": "Construction — primary defect closed on device", "changed": "Ported the r2 worktree's fixes into the main tree by hand rather than merging, because the same files carry three other agents' in-flight work. The ghost now clears on a successful placement, camera gestures are re-enabled immediately after, refunds print exact fractions (+52.5 rather than 53), boarding and aboard citizens are excluded from builder assignment, builders per site are capped at four with diminishing returns, and a tap on an incomplete friendly foundation assigns builders to it.", "taught": "Two things. First, the fix is real and photographed: place a Farm and the ghost is gone, the camera works, the panel reads +52.5 Matter. Second, and more important — the previous entry's claim that ConstructionIntegrityTests ran 10 of 10 is NOT TRUE. That worktree's own IMPLEMENTATION_STATUS.md records that xcodebuild test was hook-blocked there, so no test executed. In this environment xcodebuild test runs but the app-hosted bundle dies at bootstrap because the host needs ~55 s to build its scene. No test in this repository has ever actually executed. P14 is in flight to fix that.", "next": "CP-G2a-prime after P14: audio, Reduced Motion, the full placement-state matrix, Matter Extractor and Dwelling completion.", "proof": {"version": "0.3.0", "build": 42, "play": "Docs/QA/G2/cp-g2a/r3-device/ (8 landscape captures) + Docs/QA/G2/cp-g2a/r3-resolution.md", "status": "local"}, "before": null, "after": null}, {"id": "PLAY-02", "date": "2026-07-31", "title": "Play report, second pass — five more dead controls", "changed": "Nothing. This is a play session.", "taught": "Beyond the missing production system: camera navigation does not exist except drag-pan. The minimap has no tap or drag gesture at all, and its four tool tiles — Face north, Go to Core, Place marker, Expand map — are HUDIconTile with a glyph, a name and no action. Six of the nine command tiles are the same: Move, Gather, Guard, Set rally point and Build Outpost all have action nil. Three buildings that exist as BuildingKind cases (Formation Yard, Expansion Outpost, Dawn Loom) have no tile and can never be built, which also makes the Voyager age unreachable. The resource rate readout prints +0 while the numbers climb.", "next": "CP-G2b-NAV for camera navigation; CP-G3a for production and the command grid.", "proof": {"version": "0.3.0", "build": 42, "play": "Docs/QA/Gauntlet/play-2026-07-31/PLAY-REPORT.md + captures/", "status": "local"}, "before": null, "after": null}, {"id": "CP-G2a-R2", "date": "2026-07-30", "title": "Construction integrity — builders, cargo, refund", "changed": "Builder assignment excludes units that are boarding or aboard, carried resources have a defined disposition when a citizen starts construction, refunds report exact fractions, and stalled foundations can take builders again.", "taught": "The tests are runnable after all. A focused xctest run executed ConstructionIntegrityTests at 10 passed of 10 — which contradicts the standing claim in PROJECT_STATE.md that xcodebuild test is hook-blocked and no test has ever run.", "next": "Independent re-review, then close CP-G2a.", "proof": {"version": "0.3.0", "build": 42, "play": "Native iPadOS 26.5 replay captures under Docs/QA/G2/cp-g2a/r2-proof/", "status": "local"}, "before": null, "after": null}, {"id": "CP-G2a", "date": "2026-07-30", "title": "Construction — Farm, Matter Extractor, Dwelling", "changed": "Command tiles with cost and purpose copy, full-footprint placement legality, a drag ghost, cost on commit, citizens constructing with linear multi-builder progress, cancellation refund, and a completion cue.", "taught": "An independent read-only review returned REVISE on a single defect the builder had not seen: after a successful placement the ghost stays on the new foundation, which immediately makes that footprint illegal, so the flow ends on a red BLOCKED state. A separate critic found in minutes what the builder had looked straight through.", "next": "Fix the post-place ghost state before anything else. Do not begin CP-G2b.", "proof": {"version": "0.3.0", "build": 42, "play": "Farm flow captured on iPadOS 26.5", "status": "local"}, "before": "../QA/G2/cp-g2a/00-pre-edit-opening.png", "after": "../QA/G2/cp-g2a/15-farm-complete-fullres.png"}, {"id": "CP-14", "date": "2026-07-28", "title": "AoE land cut by void water", "changed": "Three map layouts — riverlands, basin, fjords — built from an authored land field with carved void bodies instead of unions of discs. The minimap contours the field; causeway decks span only the wet stretch. Land coverage 75.8 / 79.4 / 77.6 percent.", "taught": "Land coverage hit its target and the frame lost its art direction. Measured after the fact, void fell to 11% and then to 2.5% after the sparse retune, against concept 01's 53%, and the black point rose from 0.002 to 0.102 — the frame now contains no true blacks. The checkpoint passed because the measurement had quietly become land coverage instead of the concept comparison every checkpoint from CP-06 to CP-08 had used.", "next": "Piece P1 — restore void contrast at the play camera without giving up the continent.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5, all three layouts", "status": "local"}, "before": "../QA/AAA/cp11-pier.png", "after": "../QA/AAA/sparse-map1-riverlands.png"}, {"id": "CP-13", "date": "2026-07-28", "title": "Contiguous land maps", "changed": "Overlapping plates replaced the separate land-blob pair; coastal docks; the opening camera moved onto interior land.", "taught": "The minimap still read as discs, which is what sent the work on to CP-14.", "next": "CP-14.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": null, "after": "../QA/AAA/cp13-map1-coastland.png"}, {"id": "CP-12", "date": "2026-07-28", "title": "Mostly-land maps, neutral terrain, visual leftovers", "changed": "Void-heavy composition inverted to mostly land; a shared neutral land palette so fragments are never colour-coded by civilization; the Core plaza rosette, the pier lattice, stronger rim reach, and speed controls wired to the clock.", "taught": "Faction identity belongs on units, buildings, HUD and Core livery — not on the ground.", "next": "CP-13 contiguous land.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5, both layouts", "status": "local"}, "before": null, "after": "../QA/AAA/cp12-map1-continental.png"}, {"id": "CP-11", "date": "2026-07-28", "title": "Transport and pier", "changed": "Removed the dark spar that read as a slab bolted to the docked transport — it was the unwoven causeway field sharing the transport's dock point — and added concept 01's gold lattice pier at the rim dock.", "taught": "This frame is still the closest the project has come to concept 01: 41.5% void, a 0.002 black point, the nebula and the gas giant in shot. It is the reference for what P1 has to get back to.", "next": "CP-12 mostly-land maps.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": "../QA/AAA/cp08-void.png", "after": "../QA/AAA/cp11-pier.png"}, {"id": "CP-10", "date": "2026-07-28", "title": "HUD parity", "changed": "Top-bar centre emblem and speed cluster, an alert strip, pinned group slots, selection portraits with life meters, and minimap silhouettes drawn from the real rim outline rather than ellipses.", "taught": "Four of concept 01's five chrome surfaces now match. The group slots are still chrome only, and the alert strip shipped with a seed cue that has never cleared since.", "next": "CP-11 transport and pier.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5, with and without a selection", "status": "local"}, "before": null, "after": "../QA/AAA/cp10-hud.png"}, {"id": "CP-09", "date": "2026-07-28", "title": "Rim, deposits and plant mass", "changed": "Pale crystalline rim spurs, larger lumen clusters, and tree-scale branching crowns where every prop had previously been a medium spiky clump.", "taught": "A new prop class was not enough — the canopy pass jammed against a scatter list already packed at 1.3 metres and almost nothing placed. Scatter density is capped by site spacing, not by candidate count.", "next": "CP-10 HUD parity.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": null, "after": "../QA/AAA/cp09-rim-mass.png"}, {"id": "CP-08", "date": "2026-07-28", "title": "The void", "changed": "Nebula wash, the celestial body actually inside the frustum, and drifting debris. Void floor luma 0.006 to 0.036 against the concept's 0.032; soft-void fraction 0.023 to 0.362 against 0.338.", "taught": "The celestial body was never missing — it was outside the frustum. Orthographic sky cards clip hard at about ±38.7 at default zoom, so anything authored beyond that simply is not in the frame.", "next": "CP-09 rim and plant mass.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": "../QA/AAA/cp07-core-pavilion.png", "after": "../QA/AAA/cp08-void.png"}, {"id": "CP-07", "date": "2026-07-28", "title": "The Core pavilion", "changed": "The closed dark dome became concept 01's tented pavilion. Canopy-to-ground luminance 0.57 to 1.13 against the concept's 1.15; Core box median 0.162 to 0.391 against 0.394; cold shadow 0.207 to 0.029.", "taught": "Two thirds of the fix was geometry, not albedo. Flattening the canopy droop from 36 to 20 degrees under a 52-degree key moved the ratio further than every albedo change put together. A surface's value is mostly a question of what it points at.", "next": "CP-08 the void.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": "../QA/AAA/cp06-density-palette.png", "after": "../QA/AAA/cp07-core-pavilion.png"}, {"id": "CP-06", "date": "2026-07-28", "title": "Density and palette", "changed": "146 plantings against the concept's 132; bare-ground hue 42.2 to 32.7 degrees against the concept's 33.0; the periodic pit lattice removed from the sand.", "taught": "The 9-degree hue error was entirely in green, and it was on every lit surface at once including a near-white hull — so it was in the light, not the albedo. Rotating hue toward red costs exposure, because green carries 71% of luminance, and had to be repaid with exposureScale.", "next": "CP-07 the Core.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": "../QA/AAA/cp05-hud-chrome.png", "after": "../QA/AAA/cp06-density-palette.png"}, {"id": "CP-05", "date": "2026-07-28", "title": "HUD chrome", "changed": "A live Canvas minimap drawn from WorldMap rather than a baked image, with the camera footprint as a yaw-rotated quad; a fixed 3×3 command grid where an inapplicable command dims in place rather than disappearing.", "taught": "A Spacer inside a SwiftUI column with no width of its own makes the whole column greedy — the minimap panel stretched the length of the frame instead of sitting in its corner.", "next": "CP-06 density and palette.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5, reticle verified under a real camera pan", "status": "local"}, "before": null, "after": "../QA/AAA/cp05-hud-chrome.png"}, {"id": "CP-04", "date": "2026-07-28", "title": "Terrain relief", "changed": "Relief amplitude raised across the block and a TerrainSurface contract added so units, props, deposits and decals sit on the height field instead of on a datum plane.", "taught": "The terrain had been flat to hide a missing contract — groundHeight had exactly two callers, both inside the mesh factory, so nothing else in the project knew where the ground was. Also: a height-field grid sits above the function it samples, which is why the first render lost the gold seam network.", "next": "CP-05 HUD chrome.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": null, "after": "../QA/AAA/cp04-terrain-relief.png"}, {"id": "CP-03", "date": "2026-07-28", "title": "Make the light read", "changed": "Sunlit regolith 0.540 to 0.397 linear, landing exactly on concept 01. Frame over the bloom threshold 8.34% to 0.56%. Stars became soft points with a steepest single-pixel step of 0.12 instead of 0.62.", "taught": "Three defects that had been logged separately across two sessions were one number. Measuring the frame against the concept found it in one pass and turned the fix into arithmetic — the predicted regolith median was 0.397 and the render landed on 0.397. Measure the frame before theorising about the renderer.", "next": "CP-04 terrain relief.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": "../QA/AAA/cp02-magenta-fixed.png", "after": "../QA/AAA/cp03-light-reads.png"}, {"id": "CP-02", "date": "2026-07-27", "title": "Kill the magenta", "changed": "Fragment meshes tag faces with per-layer material indices but were being handed a single-element material array, so every face with index 1 or above resolved to no material. Placeholder-magenta pixels: 64,490 to 0.", "taught": "The material arrays are now built with allCases.map over the layer enums, so the array index is the emitted material index by construction rather than by a hand-kept parallel list that happens to be the right length today.", "next": "CP-03 make the light read.", "proof": {"version": "0.3.0", "build": 42, "play": "Captured on iPadOS 26.5", "status": "local"}, "before": "../QA/AAA/cp01-baseline-green.png", "after": "../QA/AAA/cp02-magenta-fixed.png"}, {"id": "CP-01", "date": "2026-07-27", "title": "Green tree and honest baseline", "changed": "Restored a compiling tree carrying three independent mid-flight breaks in three files, each hidden behind the last, left by parallel agents that never re-verified together. Added build-agents/ to .gitignore, dropping git status from 35,602 lines to 21.", "taught": "A green build proves nothing about the frame. Three sessions of visual work had compiled cleanly while a third of the map rendered magenta, because no session had ever rendered the code. Every checkpoint since ends with an installed build and a full-resolution capture, or it does not close.", "next": "CP-02 kill the magenta.", "proof": {"version": "0.3.0", "build": 42, "play": "First rendered frame of this codebase, iPadOS 26.5", "status": "local"}, "before": null, "after": "../QA/AAA/cp01-baseline-green.png"}], "simLease": {"holder": "none — released", "since": "2026-07-31T21:30:00+05:30", "queue": [], "device": "75898CE1-A691-4973-817A-973D4249A38F — Sunfold Cycle 1 iPad Air 13 (iOS 26.5)", "warning": "The UDID in AGENTS.md was dead and has been corrected to 75898CE1-…. A second device, CD369CF5-… 'BillBandit Test' iPhone 17 Pro, is booted and belongs to an unrelated project: never touch it. Two devices are booted, so pass the iPad UDID explicitly on every call. Also: argent's screenshot-after-gesture ignores the rotation parameter and returns a portrait-oriented frame of a landscape app — pass rotation LandscapeLeft on a standalone screenshot call when the orientation matters."}} /* INLINE_DATA_END */;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderHeader(m) {
  document.getElementById("hTitle").textContent =
    `Wave ${m.wave} — ${m.waveTitle}`;
  document.getElementById("hSub").innerHTML =
    `Sunfold Greenfield · updated ${esc((m.updated || "").replace("T", " ").slice(0, 16))}`;
  document.getElementById("hChips").innerHTML = [
    `v${esc(m.version)} · build ${esc(m.build)}`,
    esc(m.branch)
  ].map((t, i) => `<span class="chip${i ? "" : " gold"}">${t}</span>`).join("");
}

function renderNow(n) {
  if (!n) { document.getElementById("now").innerHTML = `<div class="card note">Nothing in flight.</div>`; return; }
  const meta = [
    n.piece && `piece <code>${esc(n.piece)}</code>`,
    n.model && `model <code>${esc(n.model)}</code>`,
    n.owner && `${esc(n.owner)}`,
    n.round ? `round ${esc(n.round)}` : `not started`,
    n.lastCriticVerdict && `last verdict <b>${esc(n.lastCriticVerdict)}</b>`
  ].filter(Boolean).map(t => `<span>${t}</span>`).join("");
  document.getElementById("now").innerHTML = `
    <div class="card now">
      <h3>${esc(n.title)}</h3>
      <p class="why">${esc(n.why)}</p>
      ${n.biggestGap ? `<div class="gap"><strong>Largest gap:</strong> ${esc(n.biggestGap)}</div>` : ""}
      <div class="meta">${meta}</div>
    </div>`;
}

function renderNext(list) {
  document.getElementById("next").innerHTML = (list || []).map(p => `
    <li><strong>${esc(p.piece)} — ${esc(p.title)}</strong>
        <span class="why">${esc(p.why)}</span></li>`).join("");
}

function renderBars(bars) {
  document.getElementById("bars").innerHTML = (bars || []).map(b => `
    <div class="bar">
      <div class="id">${esc(b.id)}</div>
      <div>
        <div class="axis">${esc(b.axis)}</div>
        <div class="what">${esc(b.bar)}</div>
      </div>
      <div class="state ${esc(b.state)}">${esc(b.state)}</div>
      <div class="nums"><b>target</b> ${esc(b.target)}</div>
      <div class="nums"><b>now</b> ${esc(b.current)}</div>
    </div>`).join("");
}

function renderLease(l) {
  const el = document.getElementById("lease");
  if (!l || !l.holder) {
    el.innerHTML = `<span class="dot" style="background:var(--ok)"></span> Free — any agent may take it.`;
    return;
  }
  const q = (l.queue || []).length
    ? ` · queue: ${l.queue.map(esc).map(s => `<code>${s}</code>`).join(", ")}`
    : " · queue empty";
  el.innerHTML = `<span class="dot"></span> Held by <code>${esc(l.holder)}</code>
      since ${esc((l.since || "").replace("T", " ").slice(0, 16))}${q}`;
}

function figures(e) {
  const imgs = [];
  if (e.before) imgs.push(["before", e.before]);
  if (e.after)  imgs.push(["after",  e.after]);
  if (!imgs.length) return "";
  return `<div class="ba${imgs.length === 1 ? " single" : ""}">` + imgs.map(([lab, src]) => `
    <figure><a href="${esc(src)}" target="_blank" rel="noopener">
      <img src="${esc(src)}" alt="${lab}" loading="lazy" />
    </a><figcaption>${lab}</figcaption></figure>`).join("") + `</div>`;
}

function renderLog(log) {
  document.getElementById("log").innerHTML = (log || []).map((e, i) => {
    const p = e.proof || {};
    const st = String(p.status || "local").toLowerCase();
    return `
    <details class="entry"${i === 0 ? " open" : ""}>
      <summary>
        <span class="cp">${esc(e.id)}</span>
        <span class="title">${esc(e.title)}</span>
        <span class="date">${esc(e.date)}</span>
      </summary>
      <div class="body">
        <dl>
          <div><dt>What changed</dt><dd>${esc(e.changed)}</dd></div>
          <div><dt>What play taught us</dt><dd>${esc(e.taught)}</dd></div>
          <div><dt>What comes next</dt><dd>${esc(e.next)}</dd></div>
        </dl>
        ${figures(e)}
        <div class="proof">
          <span>v${esc(p.version)} · build ${esc(p.build)}</span>
          <span>${esc(p.play || "no play record")}</span>
          <span class="st-${esc(st)}">${esc(st)}</span>
        </div>
      </div>
    </details>`;
  }).join("");
}

function render(d) {
  renderHeader(d.meta || {});
  renderNow(d.now);
  renderNext(d.next);
  renderBars(d.bars);
  renderLease(d.simLease);
  renderLog(d.log);
}

(async function () {
  try {
    const r = await fetch("workbench-data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (err) {
    if (FALLBACK) { render(FALLBACK); return; }
    document.getElementById("hSub").innerHTML =
      `<span class="err">Could not load <code>workbench-data.json</code>.</span>`;
    document.getElementById("now").innerHTML = `
      <div class="card">
        <p>This page reads <code>workbench-data.json</code> from the same directory.
        Some browsers block that over <code>file://</code>.</p>
        <p class="note">Serve the folder instead:<br />
        <code>cd Docs/Gauntlet &amp;&amp; python3 -m http.server 8080</code><br />
        then open <code>http://localhost:8080/workbench.html</code>.</p>
      </div>`;
  }
})();
</script>
